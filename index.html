<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b2537" />
  <meta name="description" content="Houd ritten, tankbeurten en kosten bij per auto." />

  <!-- PWA / Apple -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tanklog" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <title>Vroom — Autokosten Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Leaflet.markercluster CSS + JS (deferred, alleen nodig voor tankstations-overlay) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />

  <!-- App CSS -->
  <link rel="stylesheet" href="css/main.css" />
</head>

<body>

  <!-- ── SPLASH inline zodat hij direct zichtbaar is bij first paint
       (vóór partials geladen zijn). De statustekst wordt door
       Partials.load() bijgewerkt met de voortgang. ───────────── -->
  <div id="screen-splash" class="screen splash-v2" data-tijd="dag">
    <div class="splash-sky"></div>
    <div class="splash-celestial" id="splash-celestial"></div>
    <div class="splash-stars" id="splash-stars"></div>
    <div class="splash-clouds" id="splash-clouds"></div>
    <div class="splash-mountains"></div>
    <div class="splash-inner">
      <div class="splash-greeting" id="splash-greeting">Welkom</div>
      <div class="splash-title">TANKLOG</div>
      <div class="splash-sub">auto · km · kosten</div>
      <div class="splash-stage" id="splash-car-scene"></div>
      <div class="splash-loader">
        <div class="splash-spinner"></div>
        <div class="splash-loader-text">APP VOORBEREIDEN…</div>
      </div>
    </div>
  </div>

  <!-- ── Overige DOM-secties komen uit partials/. js/core/Partials.js
       fetcht elke file en vervangt de placeholder met outerHTML
       zodat de DOM-structuur identiek blijft. ───────────────── -->

  <div data-partial="intro"></div>
  <div data-partial="auto-select"></div>

  <!-- Scherm 4: hoofd-app — bevat tabs, dashboard, bottom-nav en in-app overlays -->
  <div id="screen-app" class="screen hidden">
    <div class="app-tabs">
      <div data-partial="app/kaart-tab"></div>
      <div data-partial="app/ritten-tab"></div>
      <div data-partial="app/saldo-tab"></div>
      <div data-partial="app/overzicht-tab"></div>
      <div data-partial="app/instellingen-tab"></div>
    </div>

    <div data-partial="desktop/dashboard"></div>
    <div data-partial="bottom-nav"></div>
    <div data-partial="overlays/changelog"></div>
    <div data-partial="overlays/info"></div>
  </div>

  <!-- App-onafhankelijke overlays + modals -->
  <div data-partial="overlays/install"></div>
  <div data-partial="modals/auto-toevoegen"></div>
  <div data-partial="modals/auto-wisselen"></div>
  <div data-partial="modals/rit-bewerken"></div>
  <div data-partial="modals/rit-splitsen"></div>
  <div data-partial="modals/bevestigen"></div>
  <div data-partial="modals/afrekenen"></div>
  <div data-partial="modals/install-stappen"></div>
  <div data-partial="sheets/vaste-kost"></div>

  <!-- Externe scripts onderaan (Leaflet globaal als `L`, PeerJS voor sync) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" defer></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer></script>

  <!-- App entrypoint als ES module — splash is direct zichtbaar,
       Partials.load() update de loader-tekst tijdens fetchen. -->
  <script type="module" src="js/core/main.js"></script>
</body>
</html>
